name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iett_test
          POSTGRES_DB: iett_test
          POSTGRES_PASSWORD: iett_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iett_test -d iett_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://iett_test:iett_test@localhost:5432/iett_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate a private server checkout
        run: chmod -R go-rwx src
      - run: docker build -t iett-alerts:ci .
      - name: Verify the unprivileged container entry point
        run: docker run --rm --read-only --network none iett-alerts:ci iett-bot --help
