name: iett-alerts-test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iett_test
      POSTGRES_DB: iett_test
      POSTGRES_PASSWORD: iett_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iett_test -d iett_test"]
      interval: 2s
      timeout: 5s
      retries: 20
