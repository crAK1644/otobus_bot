[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iett-telegram-alerts"
version = "0.1.0"
description = "Public Telegram subscriptions for temporary İETT service announcements"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "aiogram>=3.20,<4",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[project.scripts]
iett-bot = "iett_bot.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/iett_bot"]
